<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full-Stack Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Full-Stack Quiz</h1>

    <p id="progress"></p>

    <p id="question" tabindex="-1">Questions will appear here.</p>
    <div id="answers"></div>
    <p id="feedback" aria-live="polite"></p>

    <button id="next" type="button">Next question</button>
    <button id="restart" type="button" hidden>Restart quiz</button>

    <script src="app.js"></script>
  </body>
</html>
